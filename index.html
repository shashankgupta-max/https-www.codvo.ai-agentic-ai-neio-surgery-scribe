<div id="mc_embed_shell">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    #mc_embed_signup {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      font-family: 'Inter', Arial, sans-serif;
      color: #111827;
      background: #ffffff;
    }

    #mc_embed_signup form {
      display: block;
      width: 100%;
    }

    #mc_embed_signup #mc_embed_signup_scroll {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 20px;
    }

    #mc_embed_signup h2 {
      grid-column: 1 / -1;
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #0B1020;
    }

    #mc_embed_signup .mc-field-group:has(#mce-EMAIL),
    #mc_embed_signup .mc-field-group:has(#mce-SURGERY) {
      grid-column: 1 / -1;
    }

    #mc_embed_signup .mc-field-group {
      width: 100%;
      min-height: auto;
      padding-bottom: 0;
    }

    #mc_embed_signup label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      color: #111827;
    }

    #mc_embed_signup input,
    #mc_embed_signup select,
    #mc_embed_signup textarea {
      width: 100%;
      min-height: 48px;
      box-sizing: border-box;
      border: 1px solid #D1D5DB;
      border-radius: 12px;
      padding: 12px 14px;
      font-family: 'Inter', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: #111827;
      background: #ffffff;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    #mc_embed_signup textarea {
      min-height: 120px;
      resize: vertical;
    }

    #mc_embed_signup input::placeholder,
    #mc_embed_signup textarea::placeholder {
      color: #9CA3AF;
    }

    #mc_embed_signup input:focus,
    #mc_embed_signup select:focus,
    #mc_embed_signup textarea:focus {
      border-color: #5B5FEF;
      box-shadow: 0 0 0 4px rgba(91, 95, 239, 0.14);
    }

    #mc_embed_signup .asterisk {
      color: #5B5FEF;
    }

    #mc_embed_signup .indicates-required {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 13px;
      color: #6B7280;
      text-align: left;
    }

    #mc_embed_signup .clear,
    #mc_embed_signup .optionalParent,
    #mc_embed_signup #mce-responses {
      grid-column: 1 / -1;
    }

    #mc_embed_signup .button,
    #mc_embed_signup input[type='submit'] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 220px;
      min-height: 52px;
      margin-top: 8px;
      border: 0;
      border-radius: 999px;
      padding: 15px 26px;
      font-family: 'Inter', Arial, sans-serif;
      font-size: 15px;
      line-height: 1;
      font-weight: 700;
      color: #ffffff;
      background: #5B5FEF;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    #mc_embed_signup .button:hover,
    #mc_embed_signup input[type='submit']:hover {
      background: #4548D9;
      box-shadow: 0 12px 28px rgba(91, 95, 239, 0.24);
      transform: translateY(-1px);
    }

    #mc_embed_signup .button:active,
    #mc_embed_signup input[type='submit']:active {
      transform: translateY(0);
    }

    #mc_embed_signup div.response {
      width: 100%;
      margin: 8px 0 0;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    #mc_embed_signup #mce-error-response {
      color: #991B1B;
      background: #FEF2F2;
    }

    #mc_embed_signup #mce-success-response {
      color: #065F46;
      background: #ECFDF5;
    }

    #mc_embed_signup div.mce_inline_error {
      margin: 8px 0 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: #FEF2F2;
      color: #991B1B;
      font-size: 13px;
      font-weight: 500;
    }

    @media (max-width: 640px) {
      #mc_embed_signup #mc_embed_signup_scroll {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      #mc_embed_signup .mc-field-group,
      #mc_embed_signup .indicates-required,
      #mc_embed_signup .clear,
      #mc_embed_signup .optionalParent,
      #mc_embed_signup #mce-responses {
        grid-column: 1 / -1;
      }

      #mc_embed_signup .button,
      #mc_embed_signup input[type='submit'] {
        width: 100%;
      }
    }
  </style>

  <div id="mc_embed_signup">
    <form action="https://codvo.us18.list-manage.com/subscribe/post?u=dc490d5cba0b30848a12c5955&amp;id=bdb44f0a5b&amp;f_id=00d1b0e6f0" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_blank">
      <div id="mc_embed_signup_scroll">
        <h2>Book Free Demo &amp; Trial Today with AI Surgery Scribe</h2>

        <div class="indicates-required">
          <span class="asterisk">*</span> indicates required
        </div>

        <div class="mc-field-group">
          <label for="mce-FNAME">Name <span class="asterisk">*</span></label>
          <input type="text" name="FNAME" class="required text" id="mce-FNAME" required="" value="" placeholder="Jane Smith">
        </div>

        <div class="mc-field-group">
          <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
          <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" required="" value="" placeholder="you@company.com">
        </div>

        <div class="mc-field-group">
          <label for="mce-PHONE">Contact Number <span class="asterisk">*</span></label>
          <input type="text" name="PHONE" class="REQ_CSS" id="mce-PHONE" value="" placeholder="+1 (555) 000-0000">
        </div>

        <div class="mc-field-group">
          <label for="mce-SURGERY">How Codvo can help? <span class="asterisk">*</span></label>
          <input type="text" name="SURGERY" class="required text" id="mce-SURGERY" required="" value="" placeholder="Tell us how Codvo can help">
        </div>

        <div class="mc-field-group">
          <label for="mce-COMPANY">Organization Name <span class="asterisk">*</span></label>
          <input type="text" name="COMPANY" class="required text" id="mce-COMPANY" required="" value="" placeholder="Acme Corp">
        </div>

        <div class="mc-field-group">
          <label for="mce-JOBTITLE">Job Title <span class="asterisk">*</span></label>
          <input type="text" name="JOBTITLE" class="required text" id="mce-JOBTITLE" required="" value="" placeholder="Director, Marketing">
        </div>

        <div hidden="">
          <input type="hidden" name="tags" value="3080450">
        </div>

        <div id="mce-responses" class="clear">
          <div class="response" id="mce-error-response" style="display: none;"></div>
          <div class="response" id="mce-success-response" style="display: none;"></div>
        </div>

        <div aria-hidden="true" style="position: absolute; left: -5000px;">
          <input type="text" name="b_dc490d5cba0b30848a12c5955_bdb44f0a5b" tabindex="-1" value="">
        </div>

        <div class="clear">
          <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Book Free Trial and Demo">
        </div>
      </div>
    </form>
  </div>

  <script type="text/javascript" src="//s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"></script>
  <script type="text/javascript">
    (function($) {
      window.fnames = new Array();
      window.ftypes = new Array();

      fnames[0] = 'EMAIL';
      ftypes[0] = 'email';

      fnames[1] = 'FNAME';
      ftypes[1] = 'text';

      fnames[2] = 'PHONE';
      ftypes[2] = 'phone';

      fnames[3] = 'SURGERY';
      ftypes[3] = 'text';

      fnames[4] = 'COMPANY';
      ftypes[4] = 'text';

      fnames[5] = 'JOBTITLE';
      ftypes[5] = 'text';
    }(jQuery));

    var $mcj = jQuery.noConflict(true);
  </script>
</div>
